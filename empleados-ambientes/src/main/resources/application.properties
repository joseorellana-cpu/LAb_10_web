spring.application.name=empleados-ambientes

# Perfil activo: se toma de la variable de entorno PROFILE_ACTIVE (por defecto dev)
spring.profiles.active=${PROFILE_ACTIVE:dev}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true

# Perfiles validos (ValidadorPerfil detiene el arranque si PROFILE_ACTIVE trae otro)
empresa.perfiles-permitidos=dev,qa,test,prod
