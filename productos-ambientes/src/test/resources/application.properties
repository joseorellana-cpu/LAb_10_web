# Configuracion para pruebas: base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:lab05test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Ambiente usado durante las pruebas
empresa.ambiente=PRUEBAS
